[project]
name = "course-project1"
version = "0.1.0"
description = ""
authors = [
    {name = "shn73",email = "shn-73@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.32.4,<3.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.16.1"
black = "^25.1.0"
isort = "^6.0.1"

[tool.black]
line-length = 119
exclude = '(\.git)'

[tool.isort]
line-length = 119

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = 'venv'
